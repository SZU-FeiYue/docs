        liuxue/CompSci/2025/cases/shuozhang.md: overseas/CompSci/2025/cases/shuozhang.md
        liuxue/CompSci/2024/cases/xiaoluli.md: overseas/CompSci/2024/cases/xiaoluli.md
        liuxue/CompSci/2024/cases/wenli.md: overseas/CompSci/2024/cases/wenli.md
        liuxue/CompSci/2024/cases/jiaqisu.md: overseas/CompSci/2024/cases/jiaqisu.md
        liuxue/CompSci/2024/cases/zihaotang.md: overseas/CompSci/2024/cases/zihaotang.md
        liuxue/CompSci/2024/cases/yuanlan.md: overseas/CompSci/2024/cases/yuanlan.md
        liuxue/CompSci/2024/cases/zhengxinsu.md: overseas/CompSci/2024/cases/zhengxinsu.md
        liuxue/CompSci/2024/cases/nuochen.md: overseas/CompSci/2024/cases/nuochen.md
        liuxue/CompSci/2024/cases/ziruizhao.md: overseas/CompSci/2024/cases/ziruizhao.md
        liuxue/CompSci/2023/cases/kaishengwang.md: overseas/CompSci/2023/cases/kaishengwang.md
        liuxue/Economics/2023/cases/ziqingxu.md: overseas/Economics/2023/cases/ziqingxu.md
        liuxue/CompSci/2022/cases/zhencanpeng.md: overseas/CompSci/2022/cases/zhencanpeng.md
        liuxue/CompSci/2022/cases/zhuoxinzhan.md: overseas/CompSci/2022/cases/zhuoxinzhan.md
        main/contribute.md: contribute.md
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: false
  - git-authors:
      show_contribution: true
