name: Sync GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Publish site/ to SZU-FeiYue.github.io
        env:
          PAGES_REPO: https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/SZU-FeiYue/SZU-FeiYue.github.io.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_TOKEN }}" ]; then
            echo "Add repo secret PAGES_DEPLOY_TOKEN (write access to SZU-FeiYue/SZU-FeiYue.github.io)."
            exit 1
          fi
          ./scripts/sync-github-io.sh
